---
substitutions:
  name: "sonoff-s26"
  friendly_name: "Sonoff S26"
  comment: "Sonoff S26 Wi-Fi Smart Plug"

  # Icon to show in Home Assistant
  switch_icon: "mdi:power-socket-au"
  # Underlying restore mode for the switch
  switch_restore_mode: "RESTORE_DEFAULT_OFF"

packages:
  base: !include modules/base.yaml

esphome:
  min_version: 2024.6.0
  project:
    name: "Sonoff.S26"
    version: "v2.0.0-scsole"
  on_boot:
    - priority: 600
      then:
        - select.set_index:
            id: power_mode
            index: !lambda |-
              return id(restore_mode) - 1;
        - lambda: |-
            switch(id(restore_mode))
            {
              case 1:
              {
                id(relay).turn_off();
                break;
              }
              case 2:
              {
                id(relay).turn_on();
                break;
              }
              default:
              {
                break;
              }
            }

esp8266:
  board: esp01_1m
  restore_from_flash: true

dashboard_import:
  package_import_url: github://scsole/esphome-device-configs/sonoff-s26.yaml
  import_full_config: false

globals:
  - id: restore_mode
    type: int
    restore_value: yes
    initial_value: "3" # 1 = Always_Off, 2 = Always_On, 3 = Restore_State

select:
  - platform: template
    name: "Power On State"
    id: power_mode
    optimistic: true
    icon: mdi:electric-switch
    options:
      - Always Off
      - Always On
      - Restore State
    on_value:
      then:
        - lambda: |-
            id(restore_mode) = i + 1;
    entity_category: config

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    name: Button
    disabled_by_default: true
    on_multi_click:
      - timing:
          - ON for at most 1s
          - OFF for at least 0.1s
        then:
          - switch.toggle: relay
      - timing:
          - ON for at least 4s
        then:
          - button.press: factory_reset_button

switch:
  - platform: gpio
    name: Switch
    pin: GPIO12
    id: relay
    restore_mode: ${switch_restore_mode}
    icon: ${switch_icon}

light:
  - platform: status_led
    name: Status LED
    pin:
      number: GPIO13
      inverted: true
    entity_category: config
    disabled_by_default: true
